<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>억양 · Trò chơi ngữ điệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141a2e; --bg-alt:#1c2440; --paper:#f4ead6; --paper-dim:#e9dcc0;
    --ink:#241f18; --red:#c1432f; --gold:#d3a55f; --mint:#6fb99f; --blue:#5a8fc7;
    --line: rgba(244,234,214,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(211,165,95,0.10), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(193,67,47,0.10), transparent 45%),
      var(--bg);
    color:var(--paper); font-family:'Be Vietnam Pro', sans-serif; line-height:1.55;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .hangul{font-family:'Noto Serif KR', serif;}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px;}
  header.hero{padding:56px 0 8px;text-align:center;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:16px;}
  h1.title{font-family:'Noto Serif KR', serif;font-weight:900;font-size:clamp(17px,4vw,30px);margin:0;letter-spacing:-0.01em;color:var(--paper);word-break:keep-all;}
  main{padding:24px 0 70px;}
  .practice-box{background:var(--paper);color:var(--ink);border-radius:8px;padding:32px 28px;}
  .dots{display:flex;gap:5px;margin-bottom:22px;flex-wrap:wrap;justify-content:center;}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(36,31,24,0.18);}
  .dot.active{background:var(--red);}
  .dot.done{background:var(--mint);}
  .g-sentence{font-family:'Noto Serif KR',serif;font-weight:900;font-size:36px;text-align:center;margin-bottom:6px;}
  .g-mean{text-align:center;color:#6a6152;font-size:14px;margin-bottom:24px;}
  .g-opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:480px){.g-opts{grid-template-columns:1fr;}}
  .g-opt{
    background:var(--bg);border:1.5px solid rgba(244,234,214,0.2);border-radius:8px;
    padding:14px 10px 10px;cursor:pointer;transition:border-color .15s, transform .15s;text-align:center;
  }
  .g-opt:hover{border-color:var(--gold);transform:translateY(-2px);}
  .g-opt.correct{background:rgba(111,185,159,0.18);border-color:var(--mint);}
  .g-opt.wrong{background:rgba(193,67,47,0.18);border-color:var(--red);}
  .g-opt-label{font-size:11.5px;color:var(--paper-dim);margin-top:6px;font-weight:600;}
  .pitch-svg{width:100%;height:auto;}
  .pitch-svg .row{stroke:rgba(244,234,214,0.25);stroke-width:1;stroke-dasharray:3 3;}
  .pitch-svg .dot2{fill:var(--gold);}
  .g-fb{margin-top:16px;font-size:13.5px;color:#6a6152;min-height:36px;text-align:center;}
  .p-footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .score{font-family:'JetBrains Mono',monospace;font-size:13px;color:#6a6152;}
  .btn{font-family:'Be Vietnam Pro',sans-serif;font-weight:600;font-size:14.5px;border:none;border-radius:5px;padding:11px 18px;cursor:pointer;}
  .btn-mint{background:var(--mint);color:#08221a;}
  .btn-primary{background:var(--red);color:#fff;}
  .final-screen{display:none;text-align:center;padding:20px 0;}
  .final-screen.show{display:block;}
  .final-num{font-family:'Noto Serif KR',serif;font-size:56px;font-weight:900;color:var(--red);}
  .sec-label{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;}
  .site-logo{position:fixed;top:14px;left:18px;height:30px;width:auto;z-index:100;opacity:0.96;}
  @media(max-width:520px){.site-logo{height:22px;top:10px;left:12px;}}
</style>
</head>

<script>
/* 4 discrete pitch levels: 4=cao nhất(y15), 3=cao(y35), 2=trung(y55), 1=thấp(y75) */
const LEVEL_Y = {1:75, 2:55, 3:35, 4:15};

function pitchSvg(levels, syllables){
  const n = levels.length;
  const xs = n === 5 ? [20,56,92,128,176] : [30,80,130,170];
  const dots = xs.map((x,i)=>`<circle class="dot2" cx="${x}" cy="${LEVEL_Y[levels[i]]}" r="4"/>`).join('');
  const syls = xs.map((x,i)=>`<text class="syl" x="${x}" y="88" text-anchor="middle" font-family="Noto Serif KR, serif" font-size="12" fill="#8a8070">${syllables[i]||''}</text>`).join('');
  return `<svg class="pitch-svg" viewBox="0 0 200 90">
    <line class="row" x1="10" y1="15" x2="190" y2="15"/>
    <line class="row" x1="10" y1="35" x2="190" y2="35"/>
    <line class="row" x1="10" y1="55" x2="190" y2="55"/>
    <line class="row" x1="10" y1="75" x2="190" y2="75"/>
    ${dots}${syls}
  </svg>`;
}

    sentence:"어디에 가요?", mean:"Bạn đang đi đâu à? (chỉ xác nhận lại dự đoán)",
    syllables:["어","디","에","가","요"], audio:"qword",
    correctLevels:[2,3,2,1,4], correctLabel:"Trung-cao-trung-thấp-cao nhất (Có/Không)",
    distractorLevels:[2,4,3,2,4], distractorLabel:"Trung-cao nhất-cao-trung-cao nhất (WH)",
  },
];

let idx = 0;
let score = 0;
let answered = new Array(ROUNDS.length).fill(false);

const dotsEl = document.getElementById('dots');
ROUNDS.forEach((_,i)=>{
  const d = document.createElement('div');
  d.className = 'dot' + (i===0 ? ' active':'');
  dotsEl.appendChild(d);
});

const gSentence = document.getElementById('gSentence');
const gMean = document.getElementById('gMean');
const gOpts = document.getElementById('gOpts');
const gFb = document.getElementById('gFb');
const scoreText = document.getElementById('scoreText');
const btnNext = document.getElementById('btnNext');
const playScreen = document.getElementById('playScreen');
const finalScreen = document.getElementById('finalScreen');

function renderDots(){
  [...dotsEl.children].forEach((d,i)=>{
    d.className = 'dot' + (i===idx?' active':(answered[i]?' done':''));
  });
}

const btnListen = document.getElementById('btnListen');

function loadRound(){
  const r = ROUNDS[idx];
  gSentence.textContent = r.sentence;
  gMean.textContent = r.mean;
  gFb.textContent = '';
  btnNext.style.display = 'none';
  gOpts.innerHTML = '';

  btnListen.onclick = ()=>playAudio(r.audio);
  playAudio(r.audio);

  const opts = [
    {levels:r.correctLevels, label:r.correctLabel, correct:true},
    {levels:r.distractorLevels, label:r.distractorLabel, correct:false},
  ];
  const options = Math.random() > 0.5 ? opts : [opts[1], opts[0]];
  options.forEach(opt=>{
    const b = document.createElement('div');
    b.className = 'g-opt';
    b.innerHTML = pitchSvg(opt.levels, r.syllables) + `<div class="g-opt-label">${opt.label}</div>`;
    b.addEventListener('click', ()=>{
      if(answered[idx]) return;
      answered[idx] = true;
      [...gOpts.children].forEach(c=>c.style.pointerEvents='none');
      if(opt.correct){
        b.classList.add('correct');
        score++;
        gFb.textContent = 'Chính xác! ✅';
      } else {
        b.classList.add('wrong');
        [...gOpts.children].forEach((c,j)=>{ if(options[j].correct) c.classList.add('correct'); });
        gFb.textContent = `Chưa đúng — đường ngữ điệu đúng là "${r.correctLabel}".`;
      }
      scoreText.textContent = `Điểm: ${score} / ${ROUNDS.length}`;
      renderDots();
      btnNext.style.display = 'inline-block';
    });
    gOpts.appendChild(b);
  });
  renderDots();
  scoreText.textContent = `Điểm: ${score} / ${ROUNDS.length}`;
}
loadRound();

btnNext.addEventListener('click', ()=>{
  if(idx < ROUNDS.length - 1){
    idx++;
    loadRound();
  } else {
    playScreen.style.display = 'none';
    document.getElementById('finalScore').textContent = `${score} / ${ROUNDS.length}`;
    finalScreen.classList.add('show');
  }
});

document.getElementById('btnRestart').addEventListener('click', ()=>{
  idx = 0; score = 0; answered = new Array(ROUNDS.length).fill(false);
  finalScreen.classList.remove('show');
  playScreen.style.display = 'block';
  loadRound();
});
</script>

</body>
</html>
